variables:
  CMSSW_RELEASE: CMSSW_12_4_8
  CMSSW_SCRAM_ARCH: el8_amd64_gcc10

image: gitlab-registry.cern.ch/ci-tools/ci-worker:cs8
  
build:
    tags: [cvmfs]
    stage: build
    only:
        - merge_requests
        - master
    script:
        - export SCRAM_ARCH=$CMSSW_SCRAM_ARCH
        - set +e && source /cvmfs/cms.cern.ch/cmsset_default.sh; set -e
        - shopt -s extglob
        - scramv1 project CMSSW $CMSSW_RELEASE
        - mkdir -p $CMSSW_RELEASE/src/MuonAnalysis/MuonAnalyzer/
        - mv !($CMSSW_RELEASE) $CMSSW_RELEASE/src/MuonAnalysis/MuonAnalyzer/
        - cd $CMSSW_RELEASE/src/
        - eval `scramv1 runtime -sh`
        - scramv1 b -j5
        - bash MuonAnalysis/MuonAnalyzer/ci/tar_cmssw.sh
    artifacts:
        when: on_success
        expire_in: 1 days
        paths: 
            - build.tar.gz


run-data-aod:
    tags: [ cvmfs ] 
    stage: run
    only:
        - merge_requests
        - master
    script:
        - export SCRAM_ARCH=$CMSSW_SCRAM_ARCH
        - set +e && source /cvmfs/cms.cern.ch/cmsset_default.sh; set -e
        - shopt -s extglob
        - source ci/untar_cmssw.sh
        - printf $USER_PASS | base64 -d | kinit $USER_NAME
        - xrdcp  root://eosuser.cern.ch//eos/user/c/cmsmupog/www/MuonPOG_CI/21147607-7fc1-47ac-911f-1cdf3725fdb5.root $PWD/
        - cmsRun MuonAnalysis/MuonAnalyzer/test/run_muonAnalyzer_cfg.py inputFiles=file:21147607-7fc1-47ac-911f-1cdf3725fdb5.root globalTag=124X_dataRun3_Prompt_v4 isFullAOD=True isMC=False outputFile=output_data_aod.root
        - mv output_data_aod.root ../../


    artifacts:
        when: on_success
        expire_in: 5 days
        paths: 
            - output_data_aod.root

