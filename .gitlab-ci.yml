        - cmsRun MuonAnalysis/MuonAnalyzer/test/run_muonAnalyzer_cfg.py inputFiles=file:5d747e5f-b9d1-4b47-b730-e260990681ce.root globalTag=124X_dataRun3_Prompt_v4 isFullAOD=False isMC=False outputFile=output_data_miniaod.root
