    tags: [ cvmfs ] 
    stage: compare
    only:
        - merge_requests
        - master
    script:
        - export SCRAM_ARCH=$CMSSW_SCRAM_ARCH
        - set +e && source /cvmfs/cms.cern.ch/cmsset_default.sh; set -e
        - shopt -s extglob
        - source ci/untar_cmssw.sh
        - printf $USER_PASS | base64 -d | kinit $USER_NAME
        - xrdcp  root://eosuser.cern.ch//eos/user/c/cmsmupog/www/MuonPOG_CI/reference_run3_aod_data.root $PWD/
        - python ../../ci/compare_with_reference.py reference_run3_aod_data.root ../../output_data_aod.root _data_aod
    artifacts:
        expire_in: 20 days
        when: always
        paths: 
            - residuals_data_aod.pdf

