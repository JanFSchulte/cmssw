        - cmsRun MuonAnalysis/MuonAnalyzer/test/run_muonAnalyzer_cfg.py inputFiles=file:0243215b-f3c2-47ce-b2f4-c5243aec53c9.root globalTag=122X_mcRun3_2021_realistic_v9 isFullAOD=True isMC=True outputFile=output_mc_aod.root
